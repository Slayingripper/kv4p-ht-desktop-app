name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: kv4p-desktop-linux
            binary: kv4p-desktop
          - os: windows-2022
            artifact: kv4p-desktop-windows
            binary: kv4p-desktop.exe
          - os: macos-13
            artifact: kv4p-desktop-macos
            binary: kv4p-desktop

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libopus0

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install portaudio opus

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller kv4p-ht.spec

      - name: Verify binary exists
        run: |
          if [ ! -f "dist/${{ matrix.binary }}" ]; then
            echo "ERROR: expected dist/${{ matrix.binary }} not found"
            ls -la dist/ || true
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts into release folder
        run: |
          mkdir -p release
          find release-assets -type f -name 'kv4p-desktop*' -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
